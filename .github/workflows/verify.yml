name: Verify Andros

on:
  push:
    branches:
      - main
      - "feature/**"
      - "termux/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-build:
    name: Verify web app (no APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build web application
        run: npm run build
