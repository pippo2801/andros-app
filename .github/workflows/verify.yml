name: Verify Andros

on:
  push:
    branches:
      - main
      - "feature/**"
      - "termux/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Keep only the newest verification for each branch; avoid wasting CI minutes on stale commits.
concurrency:
  group: verify-andros-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Verify web app (no APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The repository lockfile is currently out of sync with package.json.
      # Use npm install until the lockfile is repaired and committed.
      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build
